<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Media Downloader</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f7f8;
        --card: #ffffff;
        --text: #1c1c1f;
        --muted: #6b6b74;
        --accent: #1f6feb;
        --border: #e3e3e8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16161a;
          --card: #1f1f24;
          --text: #f0f0f2;
          --muted: #9a9aa3;
          --border: #2c2c33;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header { padding: 12px 14px 6px; }
      h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.01em; }
      #page-title { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      ul { list-style: none; margin: 8px 0; padding: 0 10px; display: grid; gap: 8px; }
      li.media-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .media-details { display: grid; min-width: 0; }
      .media-thumb-wrap {
        position: relative;
        width: 160px;
        height: 90px;
        flex: 0 0 auto;
        border-radius: 6px;
        overflow: hidden;
        background: var(--border);
      }
      .media-thumb {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .media-preview {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
      }
      .media-quality {
        margin-top: 4px;
        max-width: 100%;
        font: inherit;
        font-size: 11.5px;
        color: var(--text);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 2px 4px;
      }
      .media-title-line { display: flex; align-items: center; gap: 6px; min-width: 0; }
      .media-label { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .media-source-tag {
        flex: none;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0 4px;
        line-height: 16px;
        background: var(--bg);
      }
      .media-source-select {
        flex: none;
        font: inherit;
        font-size: 10px;
        font-weight: 700;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 0 2px;
        line-height: 16px;
      }
      .media-meta { color: var(--muted); font-size: 11.5px; }
      .media-note { color: var(--muted); font-size: 10.5px; margin-top: 2px; }
      button {
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 6px 12px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.55; cursor: default; }
      #empty { padding: 22px 14px; color: var(--muted); text-align: center; }

      /* Refined bottom status bar: phase label, detail and a slim progress track. */
      #status {
        position: sticky;
        bottom: 0;
        display: grid;
        gap: 6px;
        margin-top: auto;
        padding: 10px 14px 12px;
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        border-top: 1px solid var(--border);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        font-size: 12px;
        color: var(--muted);
      }
      .status-main { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        flex: 0 0 auto;
        align-self: center;
        background: var(--muted);
        box-shadow: 0 0 0 3px transparent;
      }
      .status-label { color: var(--text); font-weight: 600; white-space: nowrap; }
      .status-detail {
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #status[data-tone='progress'] .status-dot {
        background: var(--accent);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
        animation: status-pulse 1.6s ease-in-out infinite;
      }
      #status[data-tone='success'] .status-dot {
        background: #2f9e44;
        box-shadow: 0 0 0 3px color-mix(in srgb, #2f9e44 16%, transparent);
      }
      #status[data-tone='error'] .status-dot {
        background: #e03131;
        box-shadow: 0 0 0 3px color-mix(in srgb, #e03131 16%, transparent);
      }
      .status-track {
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: var(--border);
      }
      .status-track[hidden] { display: none; }
      .status-fill {
        height: 100%;
        width: 0;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent), #7aa7ff);
        transition: width 240ms ease;
      }
      @keyframes status-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      @media (prefers-reduced-motion: reduce) {
        #status[data-tone='progress'] .status-dot { animation: none; }
        .status-fill { transition: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Media Downloader</h1>
      <span id="page-title">No page</span>
    </header>
    <ul id="media-list"></ul>
    <div id="empty">No media detected on this page yet.</div>
    <div id="status" role="status" aria-live="polite" aria-atomic="true" data-tone="idle">
      <div class="status-main">
        <span class="status-dot" aria-hidden="true"></span>
        <span class="status-label" id="status-label">Ready</span>
        <span class="status-detail" id="status-detail"></span>
      </div>
      <div class="status-track" id="status-track" role="progressbar" aria-label="Download progress" aria-valuemin="0" aria-valuemax="100" hidden>
        <div class="status-fill" id="status-fill"></div>
      </div>
    </div>
    <script type="module" src="panel.js"></script>
  </body>
</html>
